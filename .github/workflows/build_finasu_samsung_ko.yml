name: Build Samsung-patched FinaSU kernelsu.ko (android15-6.6)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build_finasu_samsung_ko.yml'
      - 'patch/finasu/finasu_samsung_kdp_defex.patch'
      - 'TRIGGER_FINASU_KO'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Clone FinaSU and apply Samsung KDP/DEFEX compat
        shell: bash
        run: |
          set -euo pipefail
          echo "KDIR=$KDIR"
          git clone --quiet https://github.com/LyraVoid/FinaSU.git /tmp/fina
          cd /tmp/fina
          git checkout --quiet 1627e52fdaf1bb5eeeb6ae763eb15c18a111511e
          echo "FINASU_HEAD=$(git rev-parse HEAD)"
          git apply --check "$GITHUB_WORKSPACE/patch/finasu/finasu_samsung_kdp_defex.patch"
          git apply "$GITHUB_WORKSPACE/patch/finasu/finasu_samsung_kdp_defex.patch"
          echo "PATCH_APPLIED_OK"
          grep -n 'KSU_SAMSUNG_KDP' kernel/Kconfig | head -3
          grep -n 'samsung_kdp.o' kernel/Kbuild | head -3

      - name: Build kernelsu.ko with trusted FinaSU manager signature
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fina/kernel
          export PATH="/opt/ddk/clang/clang-r536225/bin:$PATH"
          make -j"$(nproc)" \
            KDIR="$KDIR" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            CONFIG_KSU=m \
            CONFIG_KSU_SAMSUNG_KDP=y \
            CONFIG_KSU_SAMSUNG_DEFEX=y \
            CONFIG_KSU_DYNAMIC_MANAGER=y \
            KSU_EXPECTED_SIZE=716 \
            KSU_EXPECTED_HASH=2d89b50aaf1db013c2b6738f973f48b62ea21a3a8d7216bfec3521065d448458
          ls -l kernelsu.ko
          echo "--- verify Samsung compat strings ---"
          grep -a -o "Samsung KDP task-scoped credential" kernelsu.ko | head -1
          grep -a -o "Samsung DEFEX credential synchronization" kernelsu.ko | head -1
          grep -a -o "dynamic manager" kernelsu.ko | head -1
          echo "--- verify FinaSU manager cert ---"
          grep -a -o "2d89b50aaf1db013c2b6738f973f48b62ea21a3a8d7216bfec3521065d448458" kernelsu.ko | head -1
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp kernelsu.ko "$GITHUB_WORKSPACE/artifacts/android15-6.6_finasu_kernelsu.ko"

      - uses: actions/upload-artifact@v4
        with:
          name: finasu-ko-samsung
          path: artifacts/*.ko
